name: Check external links

on:
  schedule:
    # Every Tuesday at 07:41 UTC, independently of publishing.
    - cron: "41 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-links-${{ github.ref }}
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the site
        run: python -m portfolio_site build --output dist

      - name: Check external links and report results
        run: >-
          python -m portfolio_site check-links --output dist
          --summary "$GITHUB_STEP_SUMMARY"
