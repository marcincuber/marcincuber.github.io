<!doctype html>
<html lang="en-GB" class="no-js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>$page_title</title>
    <meta name="description" content="$description">
    <meta name="author" content="Marcin Cuber">
    <meta name="theme-color" content="#07110f">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="canonical" href="$canonical_url">
    <link rel="icon" href="$asset_prefix$icon_asset" type="image/svg+xml">
    <link rel="manifest" href="${asset_prefix}site.webmanifest">
    <link rel="stylesheet" href="$asset_prefix$css_asset">

    <meta property="og:type" content="profile">
    <meta property="og:site_name" content="Marcin Cuber — Cloud Engineering">
    <meta property="og:title" content="$page_title">
    <meta property="og:description" content="$description">
    <meta property="og:url" content="$canonical_url">
    <meta property="og:image" content="$social_image">
    <meta property="og:image:alt" content="Marcin Cuber — Principal Cloud Engineer and Lead Cloud Native Developer">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="$page_title">
    <meta name="twitter:description" content="$description">
    <meta name="twitter:image" content="$social_image">

    <script type="application/ld+json">$structured_data</script>
    <script src="$asset_prefix$js_asset" defer></script>
  </head>
  <body class="$body_class">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    $body
  </body>
</html>
