  <defs>
    <radialGradient id="glow" cx="80%" cy="10%" r="80%">
      <stop offset="0" stop-color="#214c3d"/>
      <stop offset="1" stop-color="#07110f"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
